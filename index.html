<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Il mio orologio in realtà aumentata</title>

  <!-- Libreria Google model-viewer (supporta AR su iOS e Android) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f2f2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      background: radial-gradient(circle at 50% 40%, #ffffff 0%, #d9d9df 100%);
    }

    /* Pulsante rosso in alto sullo schermo */
    #ar-button {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 16px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: #e10600;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .3px;
      white-space: nowrap;
      box-shadow: 0 6px 18px rgba(225, 6, 0, .45);
      cursor: pointer;
    }
    #ar-button:active { transform: translateX(-50%) scale(.97); }

    #hint {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
      left: 0; right: 0;
      text-align: center;
      font-size: 14px;
      color: #555;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <model-viewer
    src="iwatch.glb"
    ios-src="iwatch.usdz"
    poster="iwatch_jpg.png"
    alt="Orologio in 3D"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    shadow-intensity="1"
    shadow-softness="1"
    exposure="1"
    environment-image="neutral"
    reveal="auto"
    loading="eager">

    <!-- Pulsante rosso: appare solo se il telefono supporta l'AR -->
    <button slot="ar-button" id="ar-button">Visualizza nella realtà</button>
  </model-viewer>

  <div id="hint">Ruota l'orologio con il dito</div>

</body>
</html>
